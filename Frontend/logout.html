<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logout | ShopNest</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
  </head>
  <body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    <main class="container mx-auto px-4 py-8">
      <div class="max-w-md mx-auto bg-white rounded-lg shadow-sm p-8 text-center">
        <i class="fas fa-sign-out-alt text-5xl text-blue-500 mb-4"></i>
        <h1 class="text-2xl font-bold mb-4">You have been logged out</h1>
        <p class="text-gray-600 mb-6">
          Thank you for shopping with us. We hope to see you again soon!
        </p>
        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <a
            href="/login.html"
            class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition"
          >
            Login Again
          </a>
          <a
            href="/"
            class="border border-gray-300 px-6 py-3 rounded-lg font-semibold hover:bg-gray-100 transition"
          >
            Back to Home
          </a>
        </div>
      </div>
    </main>
    <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
  </body>
</html>
