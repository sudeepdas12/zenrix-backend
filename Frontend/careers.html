<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careers | Zenrix</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
  </head>
  <body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    <main class="container mx-auto px-4 py-8">
      <div class="mb-12">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Join Our Team</h1>
        <p class="text-gray-600 text-lg">
          We're looking for talented individuals to join our growing company.
        </p>
      </div>

      <div id="careersContainer" class="space-y-6">
        <div class="text-center py-12">
          <p class="text-gray-500">Loading job openings...</p>
        </div>
      </div>
    </main>
    <custom-footer></custom-footer>

    <!-- Application Modal -->
    <div
      id="applicationModal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50"
    >
      <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-2xl max-h-96 overflow-y-auto">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Apply for Position</h2>
        <p id="jobTitleInModal" class="text-gray-600 mb-6 font-semibold text-lg"></p>
        <form id="applicationForm" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">First Name *</label>
              <input
                type="text"
                name="firstName"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Last Name *</label>
              <input
                type="text"
                name="lastName"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
              <input
                type="email"
                name="email"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Phone *</label>
              <input
                type="tel"
                name="phone"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Resume (PDF, DOC, DOCX) - Max 5MB *</label
            >
            <div class="mt-2 flex items-center justify-center w-full">
              <label
                class="flex flex-col items-center justify-center w-full h-32 border-2 border-blue-300 border-dashed rounded-lg cursor-pointer bg-blue-50 hover:bg-blue-100 transition"
              >
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                  <svg
                    class="w-8 h-8 text-blue-600 mb-2"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                    ></path>
                  </svg>
                  <p class="text-sm text-blue-600">
                    <span class="font-semibold">Click to upload</span> or drag and drop
                  </p>
                  <p class="text-xs text-gray-600">PDF, DOC, DOCX (Max 5MB)</p>
                </div>
                <input
                  type="file"
                  name="resume"
                  accept=".pdf,.doc,.docx"
                  required
                  class="hidden"
                  id="resumeFile"
                />
              </label>
            </div>
            <p id="resumeFileName" class="text-sm text-gray-600 mt-2"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Cover Letter</label>
            <textarea
              name="coverLetter"
              rows="4"
              placeholder="Tell us why you're a great fit for this role..."
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            ></textarea>
          </div>
          <div class="flex space-x-3 pt-4">
            <button
              type="submit"
              class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition"
            >
              Submit Application
            </button>
            <button
              type="button"
              id="closeApplicationModal"
              class="flex-1 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium hover:bg-gray-300 transition"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script>
      const API_URL = '/api';

      async function loadCareers() {
        try {
          const response = await fetch(`${API_URL}/careers`);
          const data = await response.json();
          console.log('Careers loaded:', data);

          if (data.success && data.data.length > 0) {
            const container = document.getElementById('careersContainer');
            container.innerHTML = data.data
              .map(
                (job) => `
                        <div class="bg-white rounded-lg shadow-md p-8 card-hover">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h2 class="text-2xl font-bold text-gray-800">${job.title}</h2>
                                    <div class="flex flex-wrap gap-3 mt-3">
                                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
                                            📍 ${job.location}
                                        </span>
                                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-purple-100 text-purple-800">
                                            🏢 ${job.department}
                                        </span>
                                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">
                                            ⏱️ ${job.type}
                                        </span>
                                    </div>
                                </div>
                                ${
                                  job.salary && job.salary.min && job.salary.max
                                    ? `
                                    <div class="text-right">
                                        <p class="text-2xl font-bold text-green-600">$${job.salary.min.toLocaleString()}</p>
                                        <p class="text-sm text-gray-500">to $${job.salary.max.toLocaleString()}</p>
                                    </div>
                                `
                                    : ''
                                }
                            </div>
                            
                            <p class="text-gray-700 mb-4">${job.description}</p>
                            
                            ${
                              job.requirements && job.requirements.length > 0
                                ? `
                                <div class="mb-4">
                                    <h3 class="font-semibold text-gray-800 mb-2">Requirements:</h3>
                                    <ul class="list-disc list-inside space-y-1 text-gray-600">
                                        ${job.requirements.map((req) => `<li>${req}</li>`).join('')}
                                    </ul>
                                </div>
                            `
                                : ''
                            }
                            
                            ${
                              job.benefits && job.benefits.length > 0
                                ? `
                                <div class="mb-4">
                                    <h3 class="font-semibold text-gray-800 mb-2">Benefits:</h3>
                                    <ul class="list-disc list-inside space-y-1 text-gray-600">
                                        ${job.benefits.map((benefit) => `<li>${benefit}</li>`).join('')}
                                    </ul>
                                </div>
                            `
                                : ''
                            }
                            
                            <button class="apply-btn mt-6 bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition" data-job-id="${job._id}" data-job-title="${job.title}">
                                Apply Now
                            </button>
                        </div>
                    `
              )
              .join('');

            // Attach event listeners to apply buttons
            attachApplyButtonListeners();
          } else {
            document.getElementById('careersContainer').innerHTML = `
                        <div class="bg-white rounded-lg shadow-md p-12 text-center">
                            <p class="text-gray-600 text-lg">No open positions at the moment. Check back soon!</p>
                        </div>
                    `;
          }
        } catch (error) {
          console.error('Failed to load careers:', error);
          document.getElementById('careersContainer').innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-8 text-center">
                        <p class="text-red-600">Failed to load job openings. Please try again later.</p>
                    </div>
                `;
        }
      }

      function attachApplyButtonListeners() {
        document.querySelectorAll('.apply-btn').forEach((btn) => {
          btn.addEventListener('click', function () {
            console.log('Apply button clicked');
            const jobId = this.getAttribute('data-job-id');
            const jobTitle = this.getAttribute('data-job-title');
            console.log('Job ID:', jobId, 'Title:', jobTitle);
            applyForJob(jobId, jobTitle);
          });
        });
      }

      function applyForJob(jobId, jobTitle) {
        console.log('Opening application modal for:', jobId, jobTitle);
        const modal = document.getElementById('applicationModal');
        const titleElem = document.getElementById('jobTitleInModal');
        const form = document.getElementById('applicationForm');

        if (!modal || !titleElem || !form) {
          console.error('Modal elements not found');
          alert('Error: Modal elements not found');
          return;
        }

        titleElem.textContent = jobTitle;
        form.dataset.jobId = jobId;
        modal.classList.remove('hidden');
        console.log('Modal opened, jobId stored:', form.dataset.jobId);
      }

      // Close modal buttons
      document.getElementById('closeApplicationModal')?.addEventListener('click', function () {
        console.log('Close button clicked');
        document.getElementById('applicationModal').classList.add('hidden');
      });

      // Close modal when clicking outside
      document.getElementById('applicationModal')?.addEventListener('click', function (e) {
        if (e.target === this) {
          console.log('Background clicked, closing modal');
          this.classList.add('hidden');
        }
      });

      // File upload handling
      const resumeFileInput = document.getElementById('resumeFile');
      const resumeFileNameDisplay = document.getElementById('resumeFileName');
      const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB

      if (resumeFileInput) {
        resumeFileInput.addEventListener('change', function () {
          const file = this.files[0];
          if (file) {
            console.log('File selected:', file.name, 'Size:', file.size);

            if (file.size > MAX_FILE_SIZE) {
              alert(
                `❌ File size exceeds 5MB limit. Your file is ${(file.size / 1024 / 1024).toFixed(2)}MB`
              );
              this.value = '';
              resumeFileNameDisplay.textContent = '';
              return;
            }

            resumeFileNameDisplay.textContent = `✅ Selected: ${file.name} (${(file.size / 1024).toFixed(2)}KB)`;
          }
        });

        // Drag and drop
        const label = resumeFileInput.parentElement;
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach((eventName) => {
          label.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
          e.preventDefault();
          e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach((eventName) => {
          label.addEventListener(eventName, () => label.classList.add('bg-blue-200'), false);
        });

        ['dragleave', 'drop'].forEach((eventName) => {
          label.addEventListener(eventName, () => label.classList.remove('bg-blue-200'), false);
        });

        label.addEventListener(
          'drop',
          (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            resumeFileInput.files = files;

            const event = new Event('change', { bubbles: true });
            resumeFileInput.dispatchEvent(event);
          },
          false
        );
      }

      // Form submission
      document.getElementById('applicationForm')?.addEventListener('submit', async function (e) {
        e.preventDefault();
        console.log('Form submitted');

        const jobId = this.dataset.jobId;
        console.log('Submitting for job ID:', jobId);

        if (!jobId) {
          alert('Error: Job ID not found. Please try again.');
          console.error('Job ID is empty');
          return;
        }

        const resumeFile = document.getElementById('resumeFile').files[0];
        if (!resumeFile) {
          alert('❌ Please upload a resume file');
          return;
        }

        if (resumeFile.size > MAX_FILE_SIZE) {
          alert(`❌ Resume file is too large. Maximum size is 5MB.`);
          return;
        }

        const formData = new FormData();
        formData.append('firstName', document.querySelector('input[name="firstName"]').value);
        formData.append('lastName', document.querySelector('input[name="lastName"]').value);
        formData.append('email', document.querySelector('input[name="email"]').value);
        formData.append('phone', document.querySelector('input[name="phone"]').value);
        formData.append('resume', resumeFile);
        formData.append(
          'coverLetter',
          document.querySelector('textarea[name="coverLetter"]').value || ''
        );
        formData.append('status', 'submitted');

        console.log('Application data with file:', {
          firstName: formData.get('firstName'),
          lastName: formData.get('lastName'),
          email: formData.get('email'),
          phone: formData.get('phone'),
          resumeFileName: resumeFile.name,
          resumeFileSize: resumeFile.size,
          coverLetter: formData.get('coverLetter'),
        });

        try {
          const url = `${API_URL}/careers/${jobId}/apply`;
          console.log('Sending POST to:', url);

          const response = await fetch(url, {
            method: 'POST',
            body: formData,
          });

          console.log('Response status:', response.status);
          const result = await response.json();
          console.log('Response data:', result);

          if (result.success) {
            alert(
              '✅ Application submitted successfully!\n\nWe will review your application and get back to you soon.'
            );
            document.getElementById('applicationModal').classList.add('hidden');
            this.reset();
            resumeFileNameDisplay.textContent = '';
          } else {
            alert('❌ Failed to submit application: ' + (result.error || 'Unknown error'));
          }
        } catch (error) {
          console.error('Application error:', error);
          alert('❌ Network error: ' + error.message);
        }
      });

      // Load careers on page load
      document.addEventListener('DOMContentLoaded', function () {
        console.log('Page loaded, loading careers...');
        loadCareers();
      });
    </script>
    <style>
      .card-hover {
        transition: all 0.3s;
      }
      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
      }
    </style>
  </body>
</html>
