<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Zenrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body
    class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4"
  >
    <div class="w-full max-w-md">
      <!-- Logo/Brand -->
      <div class="text-center mb-8">
        <a href="index.html" class="inline-block">
          <h1
            class="text-4xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent"
          >
            Zenrix
          </h1>
        </a>
        <p class="text-gray-600 mt-2">Welcome back! Please login to your account</p>
      </div>

      <!-- Login Card -->
      <div class="bg-white rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-6">
          <div
            class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-full flex items-center justify-center mx-auto mb-4"
          >
            <i class="fas fa-user text-2xl text-white"></i>
          </div>
          <h2 class="text-2xl font-bold text-gray-900">Log In</h2>
        </div>

        <form id="loginForm" class="space-y-5">
          <!-- Email -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              <i class="fas fa-envelope text-indigo-500 mr-2"></i>Email Address
            </label>
            <input
              type="email"
              id="email"
              required
              class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition"
              placeholder="your@email.com"
            />
          </div>

          <!-- Password -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
              <i class="fas fa-lock text-indigo-500 mr-2"></i>Password
            </label>
            <div class="relative">
              <input
                type="password"
                id="password"
                required
                minlength="6"
                class="w-full px-4 py-3 pr-12 border-2 border-gray-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition"
                placeholder="••••••••"
              />
              <button
                type="button"
                data-action="togglePassword"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
              >
                <i id="passwordIcon" class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="rememberMe" class="w-4 h-4 text-indigo-600 rounded" />
              <span class="text-gray-600">Remember me</span>
            </label>
            <a href="#" class="text-indigo-600 hover:text-indigo-700 font-medium"
              >Forgot Password?</a
            >
          </div>

          <!-- Error Message -->
          <div id="errorMessage" class="hidden bg-red-50 border-2 border-red-200 rounded-xl p-4">
            <div class="flex items-center gap-3">
              <i class="fas fa-exclamation-circle text-red-600 text-xl"></i>
              <span id="errorText" class="text-red-700 font-medium"></span>
            </div>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="loginBtn"
            class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-6 py-4 rounded-xl font-semibold hover:from-indigo-700 hover:to-purple-700 transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
          >
            <i class="fas fa-sign-in-alt mr-2"></i>Log In
          </button>
        </form>

        <!-- Sign Up Link -->
        <p class="text-center mt-6 text-gray-600">
          Don't have an account?
          <a href="register.html" class="text-indigo-600 hover:text-indigo-700 font-semibold"
            >Sign Up</a
          >
        </p>
      </div>

      <!-- Back to Home -->
      <div class="text-center mt-6">
        <a
          href="index.html"
          class="text-gray-600 hover:text-gray-900 inline-flex items-center gap-2"
        >
          <i class="fas fa-arrow-left"></i>
          Back to Home
        </a>
      </div>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById('password');
        const icon = document.getElementById('passwordIcon');
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          passwordInput.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      }

      function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        errorText.textContent = message;
        errorDiv.classList.remove('hidden');
        setTimeout(() => errorDiv.classList.add('hidden'), 5000);
      }

      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
          e.preventDefault();

          const loginBtn = document.getElementById('loginBtn');
          const originalText = loginBtn.innerHTML;
          loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Logging in...';
          loginBtn.disabled = true;

          try {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/users/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (data.success) {
              // Store token and user data
              localStorage.setItem('userToken', data.token);
              localStorage.setItem('userData', JSON.stringify(data.user));

              // Redirect to profile or dashboard
              window.location.href = 'profile.html';
            } else {
              throw new Error(data.error || 'Login failed');
            }
          } catch (err) {
            showError(err.message);
            loginBtn.innerHTML = originalText;
            loginBtn.disabled = false;
          }
        });
      });
    </script>
    <script>
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.getAttribute('data-action');
        const arg = btn.getAttribute('data-arg');
        if (!action) return;
        const fn = window[action];
        if (typeof fn === 'function') {
          const prev = window.event;
          window.event = e;
          try {
            fn(arg);
          } finally {
            window.event = prev;
          }
        }
      });
    </script>
  </body>
</html>
