name: Playwright E2E Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start server
        # start server in background and wait-on the URL before running tests
        run: |
          rm -rf tmp || true
          npm run start &
          npx wait-on http://localhost:3000

      - name: Run Playwright tests (headless)
        run: npx playwright test --reporter=list
        env:
          # diagnostics off by default in CI
          E2E_DIAGNOSTICS: 'false'

      - name: Upload Playwright artifacts (traces/videos/screenshots) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tmp/**
            test-results/**
            playwright-report/**
          retention-days: 7
